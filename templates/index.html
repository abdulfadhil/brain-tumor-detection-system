<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAIN TUMOR DIAGNOSIS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a5f, #334155);
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 28px;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px dashed #007bff;
            border-radius: 10px;
            background: #f9f9f9;
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
        }

        input[type="submit"] {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        input[type="submit"]:hover {
            background: #0056b3;
        }

        @media screen and (max-width: 600px) {
            .upload-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h1>BRAIN TUMOR DIAGNOSIS</h1>
        {% if error %}
        <p role="alert" style="color: #b91c1c; margin-bottom: 16px;">
            {{ error }}
        </p>
        {% endif %}
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" multiple webkitdirectory required>
            <br>
            <input type="submit" value="Upload">
        </form>
    </div>
</body>
</html>
